<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="refresh" content="0;url=https://dopamine-blond.vercel.app/arbeitgeber/?workspace=aora-workforce">
  <title>Aora – Weiterleitung</title>
</head>
<body>
  <p>Diese alte Aora-Version wurde eingestellt. Weiterleitung zur aktuellen Demo …</p>
  <p><a href="https://dopamine-blond.vercel.app/arbeitgeber/?workspace=aora-workforce">Aktuelle Aora-Demo öffnen</a></p>
  <script>
    (() => {
      const target = new URL('https://dopamine-blond.vercel.app/arbeitgeber/');
      const current = new URL(window.location.href);
      current.searchParams.forEach((value, key) => target.searchParams.append(key, value));
      if (!target.searchParams.has('workspace')) target.searchParams.set('workspace', 'aora-workforce');
      window.location.replace(target.toString());
    })();
  </script>
</body>
</html>
