name: Sync Aora kiosk production fixes

on:
  push:
    paths:
      - .github/workflows/aora-kiosk-source-sync.yml

permissions:
  contents: write

jobs:
  patch-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch canonical edge functions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          pilot_path = Path('aora-v8-final/supabase/functions/aora-v8-pilot-workspace/index.ts')
          pilot = pilot_path.read_text()
          pilot = pilot.replace(
              'const DEFAULT_ORIGIN = "https://aora-v8-hardening.vercel.app";',
              'const DEFAULT_ORIGIN = "https://dopamine-blond.vercel.app";'
          )
          old_origins = '''const EXACT_ORIGINS = new Set([\n  "https://aora-v8-hardening.vercel.app",\n  "https://aora-v8-final.vercel.app",\n  "https://aora-workforce.vercel.app",\n]);'''
          new_origins = '''const EXACT_ORIGINS = new Set([\n  DEFAULT_ORIGIN,\n  "https://dopamine-mobins-projects-4f428afa.vercel.app",\n  "https://dopamine-git-main-mobins-projects-4f428afa.vercel.app",\n  "https://aora-v8-hardening.vercel.app",\n  "https://aora-v8-final.vercel.app",\n  "https://aora-workforce.vercel.app",\n]);'''
          if old_origins not in pilot:
              raise SystemExit('pilot origin block not found')
          pilot = pilot.replace(old_origins, new_origins, 1)
          old_geofence = '''  const request = ctx.state.clockRequests.find((item: any) =>\n    item.id === event.id && item.employeeId === ctx.session.subject_id && item.status === "pending"\n  );\n  if (!request) throw Object.assign(new Error("Die Kiosk-Anfrage ist nicht mehr aktiv."), { status: 409 });\n  const location = ctx.state.locations.find((item: any) => item.id === request.locationId && item.active !== false);'''
          new_geofence = '''  const request = ctx.state.clockRequests.find((item: any) =>\n    item.id === event.id && item.employeeId === ctx.session.subject_id\n  );\n  if (!request) throw Object.assign(new Error("Die Kiosk-Anfrage ist nicht mehr aktiv."), { status: 409 });\n  if (["approved", "denied"].includes(request.status)) return;\n  if (request.status !== "pending") throw Object.assign(new Error("Die Kiosk-Anfrage wird bereits verarbeitet."), { status: 409 });\n  const location = ctx.state.locations.find((item: any) => item.id === request.locationId && item.active !== false);'''
          if old_geofence not in pilot:
              raise SystemExit('pilot geofence block not found')
          pilot = pilot.replace(old_geofence, new_geofence, 1)
          pilot_path.write_text(pilot)

          rules_path = Path('aora-v8-final/supabase/functions/aora-v8-pilot-workspace-rules/index.ts')
          rules = rules_path.read_text()
          rules = rules.replace(
              'const UPSTREAM = `${URL}/functions/v1/aora-v8-pilot-workspace`;',
              'const UPSTREAM = `${URL}/functions/v1/aora-v8-pilot-workspace`;\nconst INVITATION_TARGET = `${URL}/functions/v1/aora-v8-invitation-patch`;'
          )
          rules = rules.replace(
              'const DEFAULT_ORIGIN = "https://aora-v8-hardening.vercel.app";',
              'const DEFAULT_ORIGIN = "https://dopamine-blond.vercel.app";'
          )
          if old_origins not in rules:
              raise SystemExit('rules origin block not found')
          rules = rules.replace(old_origins, new_origins, 1)
          rules = rules.replace(
              'const SHIFT_EVENTS = new Set(["ADD_SHIFT", "UPDATE_SHIFT"]);',
              'const SHIFT_EVENTS = new Set(["ADD_SHIFT", "UPDATE_SHIFT"]);\nconst INVITATION_EVENTS = new Set(["INVITE_MANAGER", "CREATE_EMPLOYEE_ACCOUNT", "RESEND_INVITATION", "REVOKE_INVITATION"]);'
          )
          call_marker = '''async function sessionFor(token: string) {'''
          invitation_helper = '''async function callInvitation(body: unknown) {\n  const response = await fetch(INVITATION_TARGET, {\n    method: "POST",\n    headers: {\n      "content-type": "application/json",\n      authorization: `Bearer ${SERVICE_KEY}`,\n      apikey: SERVICE_KEY,\n    },\n    body: JSON.stringify(body),\n  });\n  const text = await response.text();\n  let data: any;\n  try { data = text ? JSON.parse(text) : {}; } catch { data = { error: text }; }\n  return { ok: response.ok, status: response.status, data };\n}\n'''
          if call_marker not in rules:
              raise SystemExit('rules helper insertion point not found')
          rules = rules.replace(call_marker, invitation_helper + call_marker, 1)
          token_marker = '''    if (token.length !== 64) return reply({ error: "Sitzungstoken fehlt." }, 401, origin);\n\n    if (body.action === "load") {'''
          invitation_route = '''    if (token.length !== 64) return reply({ error: "Sitzungstoken fehlt." }, 401, origin);\n\n    if (body.action === "apply" && INVITATION_EVENTS.has(body.event?.type)) {\n      const invitation = await callInvitation(body);\n      return reply(invitation.data, invitation.status, origin);\n    }\n\n    if (body.action === "load") {'''
          if token_marker not in rules:
              raise SystemExit('rules invitation route insertion point not found')
          rules = rules.replace(token_marker, invitation_route, 1)
          rules_path.write_text(rules)
          PY

      - name: Commit source synchronization
        shell: bash
        run: |
          rm -f .github/workflows/aora-kiosk-source-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aora-v8-final/supabase/functions/aora-v8-pilot-workspace/index.ts
          git add aora-v8-final/supabase/functions/aora-v8-pilot-workspace-rules/index.ts
          git add .github/workflows/aora-kiosk-source-sync.yml
          git commit -m "Harden kiosk clock workflow and preserve invitation routing"
          git push
