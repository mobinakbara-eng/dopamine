name: Fix Aora time hub strict locators

on:
  push:
    branches:
      - agent/aora-workforce-features

permissions:
  contents: write

concurrency:
  group: aora-fix-time-hub-strict-locators
  cancel-in-progress: false

jobs:
  patch-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aora-workforce-features
      - name: Target unique dialog and page headings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          full=Path("aora-v8-final/tests/aora-four-role.spec.mjs")
          text=full.read_text()
          old='await expect(page.getByText("Korrektur beantragen")).toBeVisible()'
          new='await expect(page.getByRole("heading",{name:"Korrektur beantragen"})).toBeVisible()'
          if old not in text and new not in text:
              raise SystemExit("Correction dialog assertion not found")
          text=text.replace(old,new,1)
          for marker in ["CREATE_KIOSK_DEVICE","kioskActivation.activationCode","durationMinutes:505","inside/outside geofence enforcement"]:
              if marker not in text:
                  raise SystemExit(f"Regression marker missing: {marker}")
          full.write_text(text)

          hub=Path("aora-v8-final/tests/aora-time-correction-clock-hub.spec.mjs")
          text=hub.read_text()
          old='await expect(page.getByRole("heading",{name:"Korrektur & Stempeluhr"})).toBeVisible();\n    await expect(page.getByText("Zeitkorrekturen").first()).toBeVisible();'
          new='await expect(page.locator("h1").filter({hasText:"Korrektur & Stempeluhr"}).first()).toBeVisible();\n    await expect(page.getByText("Zeitkorrekturen").first()).toBeVisible();'
          if old not in text and new not in text:
              raise SystemExit("Manager page heading assertion not found")
          hub.write_text(text.replace(old,new,1))
          PY
          if git diff --quiet; then
            echo "Strict locators already fixed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aora-v8-final/tests/aora-four-role.spec.mjs aora-v8-final/tests/aora-time-correction-clock-hub.spec.mjs
          git commit -m "Target unique time hub headings in browser tests"
          git push origin HEAD:agent/aora-workforce-features
