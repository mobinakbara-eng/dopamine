name: Apply optional approval E2E fix
on:
  push:
    branches:
      - agent/aora-zero-cost-release-hardening
    paths:
      - ".github/workflows/aora-optional-e2e-fix.yml"
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aora-zero-cost-release-hardening
          fetch-depth: 0
      - name: Apply reviewed source replacement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("aora-v8-final/tests/aora-timesheet-document-signing.spec.mjs")
          text = path.read_text()
          marker = '''async function directCall(page,action,payload={}){
            return page.evaluate(async({action,payload})=>{
              const response=await fetch(`${CFG.url}/functions/v1/aora-v8-timesheet-document-signing`,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify({action,token:S.session?.token,...payload})});
              const type=response.headers.get("content-type")||"";
              return{status:response.status,body:type.includes("application/json")?await response.json():null};
            },{action,payload});
          }
          '''
          helper = '''async function directOptionalCall(page,action,payload={}){
            return page.evaluate(async({action,payload})=>{
              const response=await fetch(`${CFG.url}/functions/v1/aora-v8-timesheet-optional-approval`,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify({action,token:S.session?.token,...payload})});
              const type=response.headers.get("content-type")||"";
              return{status:response.status,body:type.includes("application/json")?await response.json():null};
            },{action,payload});
          }
          '''
          old = '''    const acknowledged=await runOptionalAction(employee,"approveWithoutSignature",()=>employee.getByRole("button",{name:"Ohne Unterschrift bestätigen"}).click(),[200]);
              expect(acknowledged.body.submission.status).toBe("approved");
              expect(acknowledged.body.submission.approval_method).toBe("acknowledgement");
              expect(acknowledged.body.submission.document_signature_id).toBeNull();
              expect(acknowledged.body.submission.signed_hash).toBeNull();
              expect(acknowledged.body.submission.acknowledgement_hash).toMatch(/^[a-f0-9]{64}$/);
          '''
          new = '''    await employee.getByRole("button",{name:"Ohne Unterschrift bestätigen"}).click();
              await expect(employee.locator("#timesheet-document-signing-dialog")).not.toHaveAttribute("open",{timeout:30000});
              await expect.poll(async()=>{
                const result=await directOptionalCall(employee,"unsignedApprovals");
                return result.status===200&&(result.body?.submissions||[]).some(item=>String(item.id)===String(submissionId)&&item.approval_method==="acknowledgement"&&item.status==="approved");
              },{timeout:30000}).toBe(true);
              const inbox=await directCall(employee,"employeeInbox");
              expect(inbox.status).toBe(200);
              const acknowledged=inbox.body.submissions.find(item=>String(item.id)===String(submissionId));
              expect(acknowledged.status).toBe("approved");
              expect(acknowledged.approval_method).toBe("acknowledgement");
              expect(acknowledged.document_signature_id).toBeNull();
              expect(acknowledged.signed_hash).toBeNull();
              expect(acknowledged.acknowledgement_hash).toMatch(/^[a-f0-9]{64}$/);
          '''
          if marker not in text:
              raise SystemExit("directCall marker not found")
          if old not in text:
              raise SystemExit("old acknowledgement assertion not found")
          text = text.replace(marker, marker + helper, 1).replace(old, new, 1)
          path.write_text(text)
          PY
          node --check aora-v8-final/tests/aora-timesheet-document-signing.spec.mjs
          rm -rf .aora-fixes
          rm -f .github/workflows/aora-optional-e2e-fix.yml
      - name: Validate source
        working-directory: aora-v8-final
        run: npm run check
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make optional approval E2E assert observable state"
          git push origin HEAD:agent/aora-zero-cost-release-hardening
