name: Restore full Aora four-role regression coverage

on:
  push:
    branches:
      - agent/aora-workforce-features

permissions:
  contents: write

concurrency:
  group: aora-restore-four-role-test
  cancel-in-progress: false

jobs:
  restore-and-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aora-workforce-features
          fetch-depth: 0
      - name: Restore canonical test and patch current invitation route
        shell: bash
        run: |
          set -euo pipefail
          target="aora-v8-final/tests/aora-four-role.spec.mjs"
          git fetch origin main --depth=1
          git show origin/main:"$target" > "$target"
          python3 - <<'PY'
          from pathlib import Path
          path=Path("aora-v8-final/tests/aora-four-role.spec.mjs")
          text=path.read_text()
          old='function isWorkspaceEvent(request,eventType){return request.method()==="POST"&&request.url().includes("/functions/v1/aora-v8-pilot-workspace-rules")&&String(request.postData()||"").includes(`"type":"${eventType}"`)}'
          new='''function isWorkspaceEvent(request,eventType){
            if(request.method()!=="POST"||!String(request.postData()||"").includes(`"type":"${eventType}"`))return false;
            const url=request.url();
            const invitationEvents=new Set(["INVITE_MANAGER","CREATE_EMPLOYEE_ACCOUNT","RESEND_INVITATION","REVOKE_INVITATION"]);
            return invitationEvents.has(eventType)
              ? url.includes("/functions/v1/aora-v8-invitation-patch")
              : url.includes("/functions/v1/aora-v8-pilot-workspace-rules");
          }'''
          if old not in text:
              raise SystemExit("Canonical workspace matcher not found")
          text=text.replace(old,new,1)
          for marker in ["CREATE_KIOSK_DEVICE","kioskActivation.activationCode","inside/outside geofence enforcement","durationMinutes:505","Invitation: reject breached password"]:
              if marker not in text:
                  raise SystemExit(f"Restored regression marker missing: {marker}")
          path.write_text(text)
          PY
          if git diff --quiet -- "$target"; then
            echo "Canonical test already restored."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "Restore complete four-role browser regression coverage"
          git push origin HEAD:agent/aora-workforce-features
