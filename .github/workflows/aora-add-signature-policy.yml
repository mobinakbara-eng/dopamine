name: Add manager signature policy
on:
  push:
    branches: [agent/aora-zero-cost-release-hardening]
    paths: [.github/workflows/aora-add-signature-policy.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aora-zero-cost-release-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply additive policy patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root=Path('aora-v8-final')
          migration=root/'supabase/migrations/20260806084500_employee_timesheet_signature_policy.sql'
          migration.write_text('''-- Additive per-employee signature policy. Existing data remains unchanged.\ncreate table if not exists public.employee_timesheet_signature_policies (\n  organization_id uuid not null references public.organizations(id) on delete cascade,\n  employee_id text not null,\n  signature_required boolean not null default false,\n  updated_at timestamptz not null default now(),\n  updated_by text,\n  primary key (organization_id, employee_id)\n);\n\nalter table public.employee_timesheet_signature_policies enable row level security;\n\nalter table public.timesheet_submissions\n  add column if not exists signature_required boolean not null default false;\n\ncreate index if not exists idx_timesheet_signature_policy_org\n  on public.employee_timesheet_signature_policies (organization_id, employee_id);\n\ncomment on table public.employee_timesheet_signature_policies is\n  'Manager-selected per-employee policy used only when a new timesheet approval is requested.';\ncomment on column public.timesheet_submissions.signature_required is\n  'Immutable requirement captured when this specific approval request was sent.';\n''')

          fn=root/'supabase/functions/aora-v8-timesheet-optional-approval/index.ts'
          s=fn.read_text()
          s=s.replace('const WORKFLOW_VERSION = "2026-08-06.1";','const WORKFLOW_VERSION = "2026-08-06.2";')
          anchor='async function requestOptionalApproval(ctx: any, submissionId: string) {'
          helpers='''async function signaturePolicy(ctx: any, employeeId: string) {\n  const { data } = await service.from("employee_timesheet_signature_policies")\n    .select("signature_required")\n    .eq("organization_id", ctx.organization.id)\n    .eq("employee_id", employeeId)\n    .maybeSingle();\n  return Boolean(data?.signature_required);\n}\nasync function signatureSettings(ctx: any) {\n  if (["owner", "manager"].includes(ctx.accessRole)) {\n    let employeeIds = ctx.state.employees\n      .filter((item: any) => item.active !== false && item.status !== "revoked")\n      .filter((item: any) => canAccessEmployee(ctx, String(item.id), item.locationId || item.primaryLocationId || null))\n      .map((item: any) => String(item.id));\n    if (!employeeIds.length) return { policies: [], submissions: [] };\n    const { data, error } = await service.from("employee_timesheet_signature_policies")\n      .select("employee_id,signature_required,updated_at,updated_by")\n      .eq("organization_id", ctx.organization.id)\n      .in("employee_id", employeeIds);\n    if (error) throw error;\n    return { policies: data || [], submissions: [] };\n  }\n  requireEmployee(ctx);\n  const { data, error } = await service.from("timesheet_submissions")\n    .select("id,signature_required,status")\n    .eq("organization_id", ctx.organization.id)\n    .eq("employee_id", ctx.session.subject_id)\n    .in("status", ["submitted", "approved", "locked"])\n    .order("created_at", { ascending: false })\n    .limit(100);\n  if (error) throw error;\n  return { policies: [], submissions: data || [] };\n}\nasync function setSignatureRequirement(ctx: any, employeeId: string, required: boolean) {\n  requireManager(ctx);\n  const employee = ctx.state.employees.find((item: any) => String(item.id) === employeeId && item.active !== false && item.status !== "revoked");\n  if (!employee) fail("Mitarbeiter wurde nicht gefunden.", 404);\n  const locationId = employee.locationId || employee.primaryLocationId || null;\n  if (!canAccessEmployee(ctx, employeeId, locationId)) fail("Kein Zugriff auf diesen Mitarbeiter.", 403);\n  const row = { organization_id: ctx.organization.id, employee_id: employeeId, signature_required: required, updated_at: new Date().toISOString(), updated_by: String(ctx.session.subject_id) };\n  const { data, error } = await service.from("employee_timesheet_signature_policies").upsert(row, { onConflict: "organization_id,employee_id" }).select("employee_id,signature_required,updated_at,updated_by").single();\n  if (error) throw error;\n  await service.from("audit_logs").insert({ organization_id: ctx.organization.id, id: crypto.randomUUID(), action: "TIMESHEET_SIGNATURE_POLICY_CHANGED", actor: ctx.session.subject_id, actor_type: ctx.accessRole, actor_id: ctx.session.subject_id, entity: "employee", entity_type: "employee", entity_id: employeeId, created_at: new Date().toISOString(), payload: { signatureRequired: required }, metadata: { source: "timesheet-optional-approval", workflowVersion: WORKFLOW_VERSION } });\n  return data;\n}\n\n'''
          if helpers not in s: s=s.replace(anchor,helpers+anchor)
          s=s.replace('  const now = new Date().toISOString();\n  const { data: updated, error } = await service.from("timesheet_submissions").update({','  const now = new Date().toISOString();\n  const signatureRequired = await signaturePolicy(ctx, String(submission.employee_id));\n  const { data: updated, error } = await service.from("timesheet_submissions").update({')
          s=s.replace('    acknowledged_by: null,\n  }).eq','    acknowledged_by: null,\n    signature_required: signatureRequired,\n  }).eq')
          s=s.replace('    body: `Bitte prüfe den Arbeitszeitnachweis für ${displayDate(submission.date_from)} bis ${displayDate(submission.date_to)}. Du kannst ihn mit oder ohne Unterschrift bestätigen.`,','    body: signatureRequired\n      ? `Bitte prüfe und unterschreibe den Arbeitszeitnachweis für ${displayDate(submission.date_from)} bis ${displayDate(submission.date_to)}.`\n      : `Bitte prüfe den Arbeitszeitnachweis für ${displayDate(submission.date_from)} bis ${displayDate(submission.date_to)}. Du kannst ihn mit oder ohne Unterschrift bestätigen.`,')
          s=s.replace('    payload: { source: "timesheet-optional-approval", signatureOptional: true, workflowVersion: WORKFLOW_VERSION },','    payload: { source: "timesheet-optional-approval", signatureOptional: !signatureRequired, signatureRequired, workflowVersion: WORKFLOW_VERSION },')
          s=s.replace('    snapshotHash: submission.snapshot_hash,\n  });\n  return updated;','    snapshotHash: submission.snapshot_hash,\n    signatureRequired,\n  });\n  return updated;',1)
          s=s.replace('  await assertSnapshot(submission);\n  const acknowledgedAt','  await assertSnapshot(submission);\n  if (submission.signature_required) fail("Für diesen Nachweis ist die Unterschrift verpflichtend.", 409);\n  const acknowledgedAt')
          s=s.replace('.select("id,employee_id,location_id,approval_method,acknowledged_at,status")','.select("id,employee_id,location_id,approval_method,acknowledged_at,status,signature_required")')
          route='''    if (action === "signatureSettings") {\n      return json({ ...(await signatureSettings(ctx)), workflowVersion: WORKFLOW_VERSION }, 200, origin);\n    }\n    if (action === "setSignatureRequirement") {\n      return json({ policy: await setSignatureRequirement(ctx, String(body.employeeId || ""), Boolean(body.signatureRequired)) }, 200, origin);\n    }\n'''
          s=s.replace('    if (action === "requestOptionalApproval") {',route+'    if (action === "requestOptionalApproval") {')
          fn.write_text(s)

          js=root/'app/modules/optional-timesheet-signature.js'
          s=js.read_text()
          s=s.replace('let unsignedIds=new Set(),lastDialogSubmissionId="",refreshing=false;','let unsignedIds=new Set(),requiredIds=new Set(),policies=new Map(),lastDialogSubmissionId="",refreshing=false;')
          s=s.replace('  async function refreshUnsigned(force=false){','  async function refreshSettings(){\n    if(!S?.session)return;\n    try{const data=await callOptional("signatureSettings");policies=new Map((data.policies||[]).map(item=>[String(item.employee_id),Boolean(item.signature_required)]));requiredIds=new Set((data.submissions||[]).filter(item=>item.signature_required).map(item=>String(item.id)));enhanceManagerPolicy();enhanceDialog()}catch(error){console.warn("Signature settings could not be loaded",error)}\n  }\n  async function refreshUnsigned(force=false){')
          old='''    const option=document.createElement("label");option.className="docsign-optional-toggle";option.innerHTML='<input type="checkbox" id="docsign-use-signature"><span><strong>Mit Unterschrift bestätigen</strong><small>Optional. Ohne Haken wird nur deine Bestätigung dokumentiert.</small></span>';\n    consent.before(option);consent.hidden=true;signatureBox.hidden=true;approve.textContent="Ohne Unterschrift bestätigen";\n    const toggle=option.querySelector("input");\n    toggle.addEventListener("change",event=>{const checked=event.target.checked;consent.hidden=!checked;signatureBox.hidden=!checked;approve.textContent=checked?"Bestätigen & unterschreiben":"Ohne Unterschrift bestätigen"});\n    approve.addEventListener("click",event=>{if(toggle.checked)return;event.preventDefault();event.stopImmediatePropagation();approveWithoutSignature(approve)},true);'''
          new='''    const required=requiredIds.has(String(approve.dataset.submissionId));\n    if(required){consent.hidden=false;signatureBox.hidden=false;approve.textContent="Bestätigen & unterschreiben";const note=document.createElement("div");note.className="docsign-required-note";note.innerHTML="<strong>Unterschrift erforderlich</strong><small>Der Manager hat die Unterschrift für diesen Nachweis verpflichtend eingestellt.</small>";consent.before(note);return}\n    const option=document.createElement("label");option.className="docsign-optional-toggle";option.innerHTML='<input type="checkbox" id="docsign-use-signature"><span><strong>Mit Unterschrift bestätigen</strong><small>Optional. Ohne Haken wird nur deine Bestätigung dokumentiert.</small></span>';\n    consent.before(option);consent.hidden=true;signatureBox.hidden=true;approve.textContent="Ohne Unterschrift bestätigen";\n    const toggle=option.querySelector("input");\n    toggle.addEventListener("change",event=>{const checked=event.target.checked;consent.hidden=!checked;signatureBox.hidden=!checked;approve.textContent=checked?"Bestätigen & unterschreiben":"Ohne Unterschrift bestätigen"});\n    approve.addEventListener("click",event=>{if(toggle.checked)return;event.preventDefault();event.stopImmediatePropagation();approveWithoutSignature(approve)},true);'''
          s=s.replace(old,new)
          manager_fn='''  function enhanceManagerPolicy(){\n    const select=document.getElementById("docsign-employee-select");if(!select)return;\n    const host=select.closest("label")?.parentElement;if(!host||host.querySelector(".docsign-policy-control"))return;\n    const employeeId=String(select.value||"");const required=policies.get(employeeId)===true;\n    const box=document.createElement("div");box.className="docsign-policy-control";box.innerHTML=`<span><strong>Unterschrift für diesen Mitarbeiter</strong><small>Gilt für neu gesendete Nachweise.</small></span><div><button type="button" data-signature-policy="optional" data-employee-id="${employeeId}" class="${required?"":"active"}">Optional</button><button type="button" data-signature-policy="required" data-employee-id="${employeeId}" class="${required?"active":""}">Erforderlich</button></div>`;host.appendChild(box);\n  }\n  async function savePolicy(button){\n    const required=button.dataset.signaturePolicy==="required",employeeId=String(button.dataset.employeeId||"");button.disabled=true;\n    try{await callOptional("setSignatureRequirement",{employeeId,signatureRequired:required});policies.set(employeeId,required);document.querySelector(".docsign-policy-control")?.remove();enhanceManagerPolicy();toast(required?"Unterschrift ist für neue Nachweise erforderlich.":"Unterschrift ist für neue Nachweise optional.")}catch(error){toast(error.message||"Einstellung konnte nicht gespeichert werden.","error")}finally{if(button.isConnected)button.disabled=false}\n  }\n'''
          s=s.replace('  function enhanceDialog(){',manager_fn+'  function enhanceDialog(){')
          s=s.replace('    const button=event.target?.closest?.("[data-docsign-action]");if(!button)return;','    const policyButton=event.target?.closest?.("[data-signature-policy]");if(policyButton){event.preventDefault();event.stopImmediatePropagation();savePolicy(policyButton);return}\n    const button=event.target?.closest?.("[data-docsign-action]");if(!button)return;')
          s=s.replace('const observer=new MutationObserver(()=>{patchCopy();enhanceDialog();applyStatusLabels();if(S?.session)queueMicrotask(()=>refreshUnsigned())});','const observer=new MutationObserver(()=>{patchCopy();enhanceManagerPolicy();enhanceDialog();applyStatusLabels();if(S?.session)queueMicrotask(()=>{refreshUnsigned();refreshSettings()})});')
          s=s.replace('queueMicrotask(()=>{patchCopy();refreshUnsigned(true)});','queueMicrotask(()=>{patchCopy();refreshUnsigned(true);refreshSettings()});')
          js.write_text(s)

          css=root/'app/optional-timesheet-signature.css'
          s=css.read_text()+'''\n.docsign-policy-control{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;border:1px solid #dedede;border-radius:14px;background:#fafafa}.docsign-policy-control>span{display:grid;gap:3px}.docsign-policy-control small,.docsign-required-note small{color:#666}.docsign-policy-control>div{display:flex;padding:3px;border:1px solid #d5d5d5;border-radius:11px;background:#fff}.docsign-policy-control button{border:0;background:transparent;padding:9px 14px;border-radius:8px;font-weight:700;cursor:pointer}.docsign-policy-control button.active{background:#151515;color:#fff}.docsign-required-note{display:grid;gap:4px;padding:13px 15px;border:1px solid #151515;border-radius:12px;background:#f7f7f7}@media(max-width:640px){.docsign-policy-control{align-items:stretch;flex-direction:column}.docsign-policy-control>div{display:grid;grid-template-columns:1fr 1fr}}\n'''
          css.write_text(s)

          test=root/'tests/aora-timesheet-document-signing.spec.mjs'
          s=test.read_text()
          s=s.replace('await manager.screenshot({path:path.join(screenshots,"01-manager-empty-workflow.png"),fullPage:true});','await expect(manager.getByText("Unterschrift für diesen Mitarbeiter",{exact:true})).toBeVisible({timeout:30000});\n    await expect(manager.getByRole("button",{name:"Optional",exact:true})).toHaveClass(/active/);\n    await manager.screenshot({path:path.join(screenshots,"01-manager-empty-workflow.png"),fullPage:true});')
          s=s.replace('    const versionTwo=await runAction(manager,"prepareTimesheet",()=>manager.locator(\'[data-docsign-action="prepare"]\').click(),[200]);','    await manager.getByRole("button",{name:"Erforderlich",exact:true}).click();\n    await expect(manager.getByRole("button",{name:"Erforderlich",exact:true})).toHaveClass(/active/);\n    const policy=await directOptionalCall(manager,"signatureSettings");\n    expect(policy.status).toBe(200);expect(policy.body.policies.some(item=>item.signature_required===true)).toBe(true);\n    const versionTwo=await runAction(manager,"prepareTimesheet",()=>manager.locator(\'[data-docsign-action="prepare"]\').click(),[200]);')
          s=s.replace('    await employee.locator("#docsign-use-signature").check();\n    await expect(employee.locator("#docsign-consent")).toBeVisible();','    await expect(employee.locator("#docsign-use-signature")).toHaveCount(0);\n    await expect(employee.getByText("Unterschrift erforderlich",{exact:true})).toBeVisible();\n    await expect(employee.locator("#docsign-consent")).toBeVisible();')
          test.write_text(s)
          PY
          git config user.name 'mobinakbara-eng'
          git config user.email 'mobinakbara@gmail.com'
          git add aora-v8-final
          git commit -m 'Add per-employee required or optional signature policy'
          git push origin HEAD:agent/aora-zero-cost-release-hardening
