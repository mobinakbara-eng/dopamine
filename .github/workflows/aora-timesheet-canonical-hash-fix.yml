name: Aora Timesheet Canonical Hash Fix

on:
  push:
    branches:
      - feature/timesheet-approval-xlsx

permissions:
  contents: write

concurrency:
  group: aora-timesheet-canonical-hash-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/timesheet-approval-xlsx
      - name: Canonicalize persisted snapshot hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("aora-v8-final/supabase/functions/aora-v8-timesheet-approval/index.ts")
          source = path.read_text()
          marker = '''function normalizeText(value: unknown) {
            return String(value ?? "").replace(/\\s+/g, " ").trim();
          }
          '''
          addition = '''function normalizeText(value: unknown) {
            return String(value ?? "").replace(/\\s+/g, " ").trim();
          }
          function canonicalJsonValue(value: unknown): unknown {
            if (Array.isArray(value)) return value.map(canonicalJsonValue);
            if (value && typeof value === "object") {
              const input = value as Record<string, unknown>;
              return Object.keys(input).sort().reduce<Record<string, unknown>>((result, key) => {
                result[key] = canonicalJsonValue(input[key]);
                return result;
              }, {});
            }
            return value;
          }
          function stableStringify(value: unknown) {
            return JSON.stringify(canonicalJsonValue(value));
          }
          '''
          if "function stableStringify" not in source:
              if marker not in source:
                  raise SystemExit("normalizeText insertion point not found")
              source = source.replace(marker, addition, 1)
          old = "sha256Text(JSON.stringify(snapshot))"
          count = source.count(old)
          if count not in (0, 2):
              raise SystemExit(f"unexpected snapshot hash occurrence count: {count}")
          source = source.replace(old, "sha256Text(stableStringify(snapshot))")
          path.write_text(source)
          PY
          if git diff --quiet; then
            echo "Canonical hashing already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aora-v8-final/supabase/functions/aora-v8-timesheet-approval/index.ts
          git commit -m "Fix deterministic timesheet snapshot hashing"
          git push origin HEAD:feature/timesheet-approval-xlsx
