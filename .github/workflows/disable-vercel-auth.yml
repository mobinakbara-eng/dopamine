name: Disable Vercel Authentication

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/disable-vercel-auth.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  disable-vercel-authentication:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Disable Vercel Authentication and record result
        shell: bash
        run: |
          set -u
          RESULT_FILE='.github/vercel-protection-result.json'
          mkdir -p .github
          TOKEN="${VERCEL_TOKEN:-${VERCEL_ACCESS_TOKEN:-}}"

          if [ -z "$TOKEN" ]; then
            printf '%s\n' '{"success":false,"reason":"missing_vercel_api_token"}' > "$RESULT_FILE"
          else
            HTTP_STATUS="$(curl --silent --show-error \
              --output /tmp/vercel-response.json \
              --write-out '%{http_code}' \
              --request PATCH \
              --url 'https://api.vercel.com/v9/projects/prj_h9M0ibokgd3REbVVVRkqkTBd2kgE?teamId=team_pN5AjcGql5Ur448rO3HlIe3D' \
              --header "Authorization: Bearer ${TOKEN}" \
              --header 'Content-Type: application/json' \
              --data '{"ssoProtection":null}')"

            if [[ "$HTTP_STATUS" =~ ^2 ]]; then
              printf '{"success":true,"http_status":%s,"ssoProtection":null}\n' "$HTTP_STATUS" > "$RESULT_FILE"
            else
              printf '{"success":false,"reason":"vercel_api_error","http_status":%s}\n' "$HTTP_STATUS" > "$RESULT_FILE"
            fi
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_FILE"
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record Vercel protection update result'
            git push
          fi
