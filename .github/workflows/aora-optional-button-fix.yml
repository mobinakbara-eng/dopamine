name: Fix optional approval button binding
on:
  push:
    branches:
      - agent/aora-zero-cost-release-hardening
    paths:
      - ".github/workflows/aora-optional-button-fix.yml"
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aora-zero-cost-release-hardening
          fetch-depth: 0
      - name: Bind optional approval directly to its button
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('aora-v8-final/app/modules/optional-timesheet-signature.js')
          text=path.read_text()
          old='option.querySelector("input").addEventListener("change",event=>{const checked=event.target.checked;consent.hidden=!checked;signatureBox.hidden=!checked;approve.textContent=checked?"Bestätigen & unterschreiben":"Ohne Unterschrift bestätigen"});'
          new='const toggle=option.querySelector("input");toggle.addEventListener("change",event=>{const checked=event.target.checked;consent.hidden=!checked;signatureBox.hidden=!checked;approve.textContent=checked?"Bestätigen & unterschreiben":"Ohne Unterschrift bestätigen"});approve.addEventListener("click",event=>{if(toggle.checked)return;event.preventDefault();event.stopImmediatePropagation();approveWithoutSignature(approve)},true);'
          old_handler='if(button.dataset.docsignAction==="decide"&&button.dataset.decision==="approved"){\n      const useSignature=document.getElementById("docsign-use-signature");if(useSignature&&!useSignature.checked){event.preventDefault();event.stopImmediatePropagation();approveWithoutSignature(button)}\n    }'
          if old not in text: raise SystemExit('dialog binding marker not found')
          if old_handler not in text: raise SystemExit('legacy optional handler marker not found')
          text=text.replace(old,new,1).replace(old_handler,'',1)
          path.write_text(text)
          PY
          node --check aora-v8-final/app/modules/optional-timesheet-signature.js
          rm -f .github/workflows/aora-optional-button-fix.yml
      - name: Validate complete source
        working-directory: aora-v8-final
        run: npm run check
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bind optional approval directly to its button"
          git push origin HEAD:agent/aora-zero-cost-release-hardening
