name: One-shot Team News persistence fix

on:
  push:
    branches:
      - fix/team-news-atomic-persistence

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/team-news-atomic-persistence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply Team News atomic persistence fix
        run: python3 .github/scripts/fix-team-news-persistence.py
      - name: Run checks and capture diagnostics
        shell: bash
        run: |
          set +e
          (
            cd aora-v8-final
            npm install --no-save
            npm run check
            deno check --node-modules-dir=auto supabase/functions/aora-v8-final-workspace/index.ts
          ) > .github/team-news-check.log 2>&1
          status=$?
          echo "$status" > .github/team-news-check-status
          cat .github/team-news-check.log
          exit 0
      - name: Commit patch and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aora-v8-final/supabase/functions/aora-v8-final-workspace/structural-custom.ts \
                  aora-v8-final/tests/team-news-atomic-persistence-source.mjs \
                  aora-v8-final/package.json \
                  .github/team-news-check.log \
                  .github/team-news-check-status
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Persist Team News without legacy proxy recursion"
          git push origin HEAD:fix/team-news-atomic-persistence
