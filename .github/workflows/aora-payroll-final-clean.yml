name: Final clean Aora payroll source
on:
  push:
    branches:
      - agent/aora-payroll-simple-optional-signature
    paths:
      - ".github/workflows/aora-payroll-final-clean.yml"
permissions:
  contents: write
jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aora-payroll-simple-optional-signature
          fetch-depth: 0
      - name: Validate source before cleanup
        working-directory: aora-v8-final
        run: npm run check
      - name: Remove generated output after validation
        shell: bash
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch aora-v8-final/dist
          rm -rf aora-v8-final/dist aora-v8-final/test-results aora-v8-final/playwright-report
          rm -f .github/workflows/aora-payroll-final-clean.yml
      - name: Commit final source-only branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep Aora payroll branch source-only"
          git push origin HEAD:agent/aora-payroll-simple-optional-signature
