name: One-shot Team News location guard fix

on:
  push:
    branches:
      - fix/team-news-location-guard

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/team-news-location-guard
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply focused Team News fix and regression contracts
        run: python3 .github/scripts/fix-team-news.py
      - name: Install dependencies and run release checks
        working-directory: aora-v8-final
        run: |
          npm install --no-save
          npm run check
          deno check --node-modules-dir=auto supabase/functions/aora-v8-pilot-workspace/index.ts
      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No patch changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aora-v8-final/supabase/functions/aora-v8-pilot-workspace/index.ts \
                  aora-v8-final/app/modules/modals.js \
                  aora-v8-final/tests/team-news-location-guard-source.mjs \
                  aora-v8-final/package.json
          git commit -m "Fix manager Team News location authorization"
          git push origin HEAD:fix/team-news-location-guard
