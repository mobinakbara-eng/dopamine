name: Fix optional approval empty cache
on:
  push:
    branches: [agent/aora-zero-cost-release-hardening]
    paths: [.github/workflows/aora-fix-empty-cache.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aora-zero-cost-release-hardening
      - name: Patch empty cache behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('aora-v8-final/app/modules/optional-timesheet-signature.js')
          s=p.read_text()
          s=s.replace('settingsRefreshing=false,settingsLoadedAt=0;','settingsRefreshing=false,settingsLoadedAt=0,unsignedLoadedAt=0;')
          s=s.replace('if(!force&&unsignedIds.size)return applyStatusLabels();','if(!force&&unsignedLoadedAt&&Date.now()-unsignedLoadedAt<10000)return applyStatusLabels();')
          s=s.replace('unsignedIds=new Set((data.submissions||[]).map(item=>String(item.id)));applyStatusLabels()','unsignedIds=new Set((data.submissions||[]).map(item=>String(item.id)));unsignedLoadedAt=Date.now();applyStatusLabels()')
          s=s.replace('unsignedIds.add(String(button.dataset.submissionId));closeApprovalDialogs();','unsignedIds.add(String(button.dataset.submissionId));unsignedLoadedAt=Date.now();closeApprovalDialogs();')
          p.write_text(s)
          PY
          git config user.name 'mobinakbara-eng'
          git config user.email 'mobinakbara@gmail.com'
          git add aora-v8-final/app/modules/optional-timesheet-signature.js
          git commit -m 'Cache empty unsigned approval results'
          git push origin HEAD:agent/aora-zero-cost-release-hardening
