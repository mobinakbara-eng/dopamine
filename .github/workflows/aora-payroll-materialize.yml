name: Materialize Aora payroll update
on:
  push:
    branches:
      - agent/aora-payroll-simple-optional-signature
    paths:
      - ".github/workflows/aora-payroll-materialize.yml"
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aora-payroll-simple-optional-signature
          fetch-depth: 0
      - name: Materialize reviewed payroll files
        shell: bash
        run: |
          set -euo pipefail
          cat .aora-payload/part-* > /tmp/aora-payload.b64
          base64 -d /tmp/aora-payload.b64 > /tmp/aora-payload.tar.xz
          tar -xJf /tmp/aora-payload.tar.xz -C "$GITHUB_WORKSPACE"
          node -e 'const fs=require("fs");const p="aora-v8-final/package.json";const j=JSON.parse(fs.readFileSync(p,"utf8"));j.version="8.1.0-production";fs.writeFileSync(p,JSON.stringify(j,null,2)+"\n")'
          rm -rf .aora-payload
          rm -f .github/workflows/aora-payroll-materialize.yml
      - name: Validate source contracts
        working-directory: aora-v8-final
        run: npm run check
      - name: Commit materialized update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add simple payroll preparation and optional signatures"
          git push origin HEAD:agent/aora-payroll-simple-optional-signature
