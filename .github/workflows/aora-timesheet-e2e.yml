# Isolated release gate for public privacy pages and document-scoped employee timesheet signatures
name: Aora Timesheet Approval E2E

on:
  pull_request:
    branches:
      - main
    paths:
      - "aora-v8-final/**"
      - ".github/workflows/aora-timesheet-e2e.yml"
  push:
    branches:
      - main
    paths:
      - "aora-v8-final/**"
      - ".github/workflows/aora-timesheet-e2e.yml"
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aora-timesheet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-artifact:
    name: Timesheet production and staging artifacts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aora-v8-final
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate release hardening contract
        run: |
          deno check --node-modules-dir=auto supabase/functions/aora-v8-timesheet-ci-bootstrap/index.ts
          node tests/zero-cost-release-hardening.mjs
      - name: Build production artifact
        env:
          AORA_DEPLOY_ENV: production
        run: npm run build
      - name: Bind production artifact to source commit
        run: |
          printf '%s\n' "$GITHUB_SHA" > artifact-source.txt
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > artifact-manifest.sha256
          sha256sum -c artifact-manifest.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: aora-timesheet-production-${{ github.sha }}
          path: |
            aora-v8-final/dist
            aora-v8-final/artifact-source.txt
            aora-v8-final/artifact-manifest.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Build staging browser artifact
        env:
          AORA_DEPLOY_ENV: staging
        run: npm run build
      - name: Bind staging artifact to source commit
        run: |
          printf '%s\n' "$GITHUB_SHA" > artifact-source.txt
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > artifact-manifest.sha256
          sha256sum -c artifact-manifest.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: aora-timesheet-staging-${{ github.sha }}
          path: |
            aora-v8-final/dist
            aora-v8-final/artifact-source.txt
            aora-v8-final/artifact-manifest.sha256
          if-no-files-found: error
          retention-days: 7

  immutable-artifact:
    name: Timesheet immutable production artifact verification
    needs: source-artifact
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aora-v8-final
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aora-timesheet-production-${{ github.sha }}
          path: aora-v8-final
      - name: Verify source binding and every output byte
        run: |
          test "$(cat artifact-source.txt)" = "$GITHUB_SHA"
          sha256sum -c artifact-manifest.sha256

  timesheet-e2e:
    name: Privacy, unsigned preview, one-time signature, PDF and Excel gate
    needs: [source-artifact, immutable-artifact]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: aora-v8-final
    env:
      AORA_CI_BOOTSTRAP_URL: https://xqgkawskftzurbujrpex.supabase.co/functions/v1/aora-v8-timesheet-ci-bootstrap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: aora-timesheet-staging-${{ github.sha }}
          path: aora-v8-final
      - name: Verify browser artifact source and bytes
        run: |
          test "$(cat artifact-source.txt)" = "$GITHUB_SHA"
          sha256sum -c artifact-manifest.sha256
      - name: Bootstrap isolated timesheet tenant with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          response_file="$GITHUB_WORKSPACE/aora-v8-final/timesheet-bootstrap-response.json"
          oidc_json=$(curl --fail-with-body -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=aora-timesheet-ci")
          oidc_token=$(jq -er '.value' <<<"$oidc_json")
          echo "::add-mask::$oidc_token"
          status=$(curl -sS -o "$response_file" -w '%{http_code}' \
            -X POST "$AORA_CI_BOOTSTRAP_URL" \
            -H "Authorization: Bearer $oidc_token" \
            -H 'content-type: application/json' \
            --data '{"action":"bootstrap"}')
          test "$status" = "201"
          jq -e '.workspaceSlug and .manager.email and .manager.password and .employee.email and .employee.password and .testDate' "$response_file" >/dev/null
          mapfile -t masked_values < <(jq -r '[.workspaceSlug,.manager.email,.manager.password,.employee.email,.employee.password] | .[]' "$response_file")
          for value in "${masked_values[@]}"; do echo "::add-mask::$value"; done
          {
            echo "AORA_WORKSPACE_SLUG=$(jq -r '.workspaceSlug' "$response_file")"
            echo "AORA_MANAGER_EMAIL=$(jq -r '.manager.email' "$response_file")"
            echo "AORA_MANAGER_PASSWORD=$(jq -r '.manager.password' "$response_file")"
            echo "AORA_EMPLOYEE_EMAIL=$(jq -r '.employee.email' "$response_file")"
            echo "AORA_EMPLOYEE_PASSWORD=$(jq -r '.employee.password' "$response_file")"
            echo "AORA_TEST_DATE=$(jq -r '.testDate' "$response_file")"
          } >> "$GITHUB_ENV"
          rm -f "$response_file"
      - name: Install Chromium and document validators
        run: |
          npm install --no-save @playwright/test@1.56.1 pdf-parse@1.1.1 fflate@0.8.2
          npx playwright install --with-deps chromium
      - name: Verify public privacy center and placeholders
        run: npx playwright test tests/aora-privacy.spec.mjs --project=privacy-public --no-deps
      - name: Run unsigned preview and document-scoped signature flow
        run: npx playwright test tests/aora-timesheet-document-signing.spec.mjs --project=timesheet-approval --no-deps
      - name: Upload screenshots, PDF, Excel and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aora-document-signing-evidence
          path: |
            aora-v8-final/test-results/**/document-signing-evidence/**
            aora-v8-final/test-results/**/test-failed-*.png
            aora-v8-final/playwright-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Cleanup isolated timesheet tenant
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${AORA_WORKSPACE_SLUG:-}" ]; then exit 0; fi
          oidc_json=$(curl --fail-with-body -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=aora-timesheet-ci")
          oidc_token=$(jq -er '.value' <<<"$oidc_json")
          echo "::add-mask::$oidc_token"
          payload=$(jq -cn --arg workspaceSlug "$AORA_WORKSPACE_SLUG" '{action:"cleanup",workspaceSlug:$workspaceSlug}')
          curl --fail-with-body --retry 4 --retry-all-errors --retry-delay 2 -sS \
            -X POST "$AORA_CI_BOOTSTRAP_URL" \
            -H "Authorization: Bearer $oidc_token" \
            -H 'content-type: application/json' \
            --data "$payload" >/dev/null

  release-gate:
    name: Aora timesheet release gate
    if: always()
    needs: [source-artifact, immutable-artifact, timesheet-e2e]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Enforce mandatory checks for this event
        env:
          SOURCE_RESULT: ${{ needs.source-artifact.result }}
          ARTIFACT_RESULT: ${{ needs.immutable-artifact.result }}
          E2E_RESULT: ${{ needs.timesheet-e2e.result }}
        run: |
          test "$SOURCE_RESULT" = "success"
          test "$ARTIFACT_RESULT" = "success"
          test "$E2E_RESULT" = "success"
