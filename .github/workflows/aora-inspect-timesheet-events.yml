name: Inspect timesheet event ordering
on:
  push:
    branches:
      - agent/aora-zero-cost-release-hardening
    paths:
      - ".github/workflows/aora-inspect-timesheet-events.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aora-zero-cost-release-hardening
      - name: Show event listener section
        shell: bash
        run: |
          set -euo pipefail
          grep -n -B 15 -A 80 "addEventListener" aora-v8-final/app/modules/timesheet-document-signing.js | tail -n 180
