name: Materialize optional signature E2E
on:
  push:
    branches:
      - agent/aora-payroll-simple-optional-signature
    paths:
      - ".github/workflows/aora-optional-signature-e2e-materialize.yml"
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aora-payroll-simple-optional-signature
          fetch-depth: 0
      - name: Apply reviewed E2E patch
        shell: bash
        run: |
          set -euo pipefail
          cat .aora-patches/part-* | base64 -d > /tmp/optional-signature.patch
          git apply --check /tmp/optional-signature.patch
          git apply /tmp/optional-signature.patch
          node --check aora-v8-final/tests/aora-timesheet-document-signing.spec.mjs
          rm -rf .aora-patches
          rm -f .github/workflows/aora-payroll-browser-artifact.yml
          rm -f .github/workflows/aora-optional-signature-e2e-materialize.yml
      - name: Run source checks
        working-directory: aora-v8-final
        run: npm run check
      - name: Commit clean tested branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Test optional and signed timesheet approvals"
          git push origin HEAD:agent/aora-payroll-simple-optional-signature
