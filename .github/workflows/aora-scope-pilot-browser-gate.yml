name: Scope Aora pilot browser gate

on:
  push:
    branches:
      - agent/aora-workforce-features

permissions:
  contents: write

concurrency:
  group: aora-scope-pilot-browser-gate
  cancel-in-progress: false

jobs:
  patch-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aora-workforce-features
      - name: Keep timesheet validation in its dedicated isolated gate
        shell: bash
        run: |
          set -euo pipefail
          file=".github/workflows/aora-v8-pilot-ci.yml"
          python3 - <<'PY'
          from pathlib import Path
          path=Path(".github/workflows/aora-v8-pilot-ci.yml")
          text=path.read_text()
          old='''      - name: Run four-role, invitation replay and offline-resync tests
                run: npm run test:e2e'''
          new='''      - name: Run four-role, invitation replay and offline-resync tests
                run: npx playwright test --project=chromium'''
          if old not in text and new not in text:
              raise SystemExit("Pilot browser command not found")
          path.write_text(text.replace(old,new,1))
          PY
          if git diff --quiet -- "$file"; then
            echo "Pilot browser gate already scoped."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          git commit -m "Scope pilot browser gate to four-role projects"
          git push origin HEAD:agent/aora-workforce-features
