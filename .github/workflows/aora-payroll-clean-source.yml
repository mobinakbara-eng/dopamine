name: Clean generated Aora artifacts
on:
  push:
    branches:
      - agent/aora-payroll-simple-optional-signature
    paths:
      - ".github/workflows/aora-payroll-clean-source.yml"
permissions:
  contents: write
jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aora-payroll-simple-optional-signature
          fetch-depth: 0
      - name: Remove generated build output
        shell: bash
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch aora-v8-final/dist
          rm -f .github/workflows/aora-payroll-clean-source.yml
      - name: Re-run source validation
        working-directory: aora-v8-final
        run: npm run check
      - name: Commit clean source branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove generated build output"
          git push origin HEAD:agent/aora-payroll-simple-optional-signature
